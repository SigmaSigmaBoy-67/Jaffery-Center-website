        <path d="M0 714h496M1508 714h92M0 742h496M1508 742h92M0 957h490M1510 957h90" stroke-width="3"/>
        <path d="M175 80v602m154-602v602m101-602v602M1212 101v171m84-171v171" stroke-width="1" opacity=".52"/>
      </g>
      <g id="arch-light" opacity=".56">
        <path d="M700 426C700 199 850 72 1090 72s390 127 390 354" fill="none" stroke="#e8cb8a" stroke-width="16" stroke-opacity=".23" filter="url(#soft-light)"/>
        <path d="M700 424C700 200 850 74 1090 74s390 126 390 350" fill="none" stroke="#efd8a5" stroke-width="3" stroke-opacity=".7"/>
      </g>
      <g id="left-pilaster">
        <path d="M535 1000V469c0-46 29-79 74-84l46-5v620Z" fill="#223c33"/>
        <path d="M574 1000V473c0-20 14-39 36-42l25-3v572Z" fill="#385448"/>
        <path d="M535 472h120M530 517h125M520 950h137" stroke="#c0a36a" stroke-opacity=".6" stroke-width="5"/>
        <path d="M547 471v481m91-478v476" stroke="#e0c88f" stroke-opacity=".38" stroke-width="2"/>
      </g>
      <g id="right-pilaster">
        <path d="M1426 380 1470 384c45 4 74 38 74 84v532h-118Z" fill="#1a3029"/>
        <path d="m1440 402 25 3c22 3 36 22 36 42v553h-61Z" fill="#354f43"/>
        <path d="M1410 472h125M1406 517h130M1408 950h132" stroke="#c0a36a" stroke-opacity=".56" stroke-width="5"/>
        <path d="M1430 404v548m93-530v530" stroke="#e0c88f" stroke-opacity=".34" stroke-width="2"/>
      </g>
      <path d="M0 0h1600v28H0z" fill="#12221e" opacity=".8"/>
      <path d="M0 28h1600" stroke="#c4a56c" stroke-opacity=".2" stroke-width="2"/>
    </g>
    <g id="geometric-screen">
      <path d="M1280 650h225v350h-225z" fill="#142a24" fill-opacity=".6" stroke="#c5a86f" stroke-opacity=".72" stroke-width="4"/>
      <path d="M1293 663h199v324h-199z" fill="url(#screen-pattern)" opacity=".84"/>
      <path d="M1264 642h257v16h-257zm0 350h257v16h-257z" fill="#b69a63" opacity=".82"/>
      <path d="M1279 636v370m227-370v370" stroke="#d3bb87" stroke-opacity=".68" stroke-width="4"/>
    </g>
    <g id="foreground-detail" fill="none" stroke="#d0b47d" stroke-opacity=".46">
      <path d="M0 1000h1600M0 982h1600" stroke-width="3"/>
      <path d="M72 0v1000M1528 0v1000" stroke-width="2" opacity=".35"/>
      <path d="M50 905h410m1110 0h-60M40 925h425m1110 0h-74" stroke-width="2"/>
    </g>
  </g>
</svg>
